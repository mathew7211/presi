<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Punkte und Kanten</title>

    <style>
        .container {
    position: relative;
    width: 100vw;
    height: 100vh;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}
#svgOverlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    pointer-events: none;
}

 #textBereich {
        position: absolute;
        top: 0;
        right: 0;

        width: 900px;
        height: 100%;

        box-sizing: border-box;
        padding: 20px;

        background: rgba(255, 255, 255, 0);
        border-left: 1px solid black;

        z-index: 10;
    }

    #text {
        width: 100%;
        height: 100%;

        box-sizing: border-box;

        resize: none;
        border: none;
        outline: none;

        font-size: 18px;
        font-family: Arial, sans-serif;
    }
    </style>
</head>

<body>

<div class="container">



    <canvas id="canvas"></canvas>
    


    <div id="textBereich">
       <iframe 
    src="Graph.pdf#toolbar=0&navpanes=0&scrollbar=0&zoom=150"
    width="100%"
    height="100%"
    style="border: none;">
</iframe>
    </div>
    
</div>

<script>


    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const rand = 20;

    const min_x = rand;
    const max_x = canvas.width - rand-900;

    const min_y = rand;
    const max_y = canvas.height - rand;


      let gezogenerPunkt = null;


        const anzahlpunkte= 50;
        let erschienenepunkte=0;
        

        let letzteAddition = performance.now();

        const wartezeit = 500; 

        let punkte =[];


        
      const kanten = [
  // K5 – vollständiger Graph
  [1, 2], [1, 3], [1, 4], [1, 5],
  [2, 3], [2, 4], [2, 5],
  [3, 4], [3, 5],
  [4, 5],

  // P6 – Pfad
  [6, 7], [7, 8], [8, 9], [9, 10], [10, 11],

  // C6 – Zyklus
  [12, 13], [12, 17],
  [13, 14], [14, 15], [15, 16], [16, 17],

  // Stern K1,5
  [18, 19], [18, 20], [18, 21], [18, 22], [18, 23],

  // W6 – Radgraph
  [24, 25], [24, 26], [24, 27], [24, 28], [24, 29],
  [25, 26], [26, 27], [27, 28], [28, 29], [25, 29],

  // K3,3 – vollständiger bipartiter Graph
  [30, 33], [30, 34], [30, 35],
  [31, 33], [31, 34], [31, 35],
  [32, 33], [32, 34], [32, 35],

  // Baum
  [36, 37], [36, 38], [36, 39],
  [37, 40], [37, 41], [39, 42],

  // Würfelgraph Q3
  [43, 44], [43, 45], [43, 47],
  [44, 46], [44, 48],
  [45, 46], [45, 49],
  [46, 50],
  [47, 48], [47, 49],
  [48, 50],
  [49, 50]
];


       

        

        const kompliment = [];

        for (let i = 0; i < anzahlpunkte; i++) {
            for (let j = i+1; j <= anzahlpunkte; j++) {
            
                kompliment.push([i, j]);
            
            
        }
            
        }


    
    function zeichnen() {

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const drag1 = 0.000001;
        const jetzt = performance.now();

        if (
            erschienenepunkte < anzahlpunkte &&
            jetzt - letzteAddition >= wartezeit
        ) {
            const a = Math.floor(Math.random() * 401) + 300;
            const b = Math.floor(Math.random() * 401) + 300;

            punkte.push({
                x: a,
                y: b
            });

            erschienenepunkte++;

            letzteAddition = jetzt;
        }



    
        for (const komplet of kompliment) {

            if(erschienenepunkte>komplet[1]){
                const k1=punkte[komplet[0]];
            const k2=punkte[komplet[1]];

            const dist_x = k1.x-k2.x;
            const dist_y = k1.y-k2.y;

            const dist = Math.hypot(dist_x,dist_y);

            const kraft = 1/(dist*dist);
            
            
            
            if(gezogenerPunkt!=k1&&dist<300){
                k1.x = Math.max(
                    Math.min(k1.x + dist_x * kraft, max_x),
                    min_x
                );

                k1.y = Math.max(
                    Math.min(k1.y + dist_y * kraft, max_y),
                    min_y
                );
            }
            
            if(gezogenerPunkt!=k2&&dist<200){
            k2.x = Math.max(
                    Math.min(k2.x - dist_x * kraft, max_x),
                    min_x
                );

                k2.y = Math.max(
                    Math.min(k2.y - dist_y * kraft, max_y),
                    min_y
                );
            }


            }


        }

        for (const kante of kanten) {
            if(erschienenepunkte>kante[1]){
            const punkt1 = punkte[kante[0]];
            const punkt2 = punkte[kante[1]];

            let displacment_x = punkte[kante[0]].x-punkte[kante[1]].x
            let displacment_y = punkte[kante[0]].y-punkte[kante[1]].y

            let displacment= 30-Math.sqrt(Math.pow(displacment_x,2)+Math.pow(displacment_y,2))

            displacment= Math.sign(displacment)*displacment*displacment;

            if(gezogenerPunkt!=punkt1){
            punkt1.x+=displacment_x*(displacment)*drag1;
            punkt1.y+=displacment_y*(displacment)*drag1;
            }

            if(gezogenerPunkt!=punkt2){
            punkt2.x-=displacment_x*(displacment)*drag1;
            punkt2.y-=displacment_y*(displacment)*drag1;
            }

        

            ctx.beginPath();

            ctx.moveTo(punkt1.x, punkt1.y);
            ctx.lineTo(punkt2.x, punkt2.y);

            ctx.strokeStyle = "black";
            ctx.stroke();
        }
    }


      
        for (const punkt of punkte) {

            ctx.beginPath();

            ctx.arc(
                punkt.x,
                punkt.y,
                5,
                0,
                Math.PI * 2
            );
            if(punkt==seletc1||punkt==seletc2){
                ctx.fillStyle = "red";
            }else{
              ctx.fillStyle = "black";  
            }
            
            ctx.fill();
        }



        requestAnimationFrame(zeichnen);
    }

    let seletc1=null;
    let seletc2=null;
    let selecting = 0; // 0 no pints jet 1 2 


    function deletion(){
        if (selecting !== 3) {
            return;
        }

        let i_ = punkte.indexOf(seletc1);
        let j_ = punkte.indexOf(seletc2);

        let i = Math.min(i_, j_);
        let j = Math.max(i_, j_);

        const index = kanten.findIndex(
            k => k[0] === i && k[1] === j
        );

        if (index !== -1) {
            kanten.splice(index, 1);
        }

        selecting = 0;
        seletc1=null;
            seletc2=null;








    }

        function addition() {
            if (selecting !== 3) {
                return;
            }

            let i_ = punkte.indexOf(seletc1);
            let j_ = punkte.indexOf(seletc2);

            let i = Math.min(i_, j_);
            let j = Math.max(i_, j_);

            kanten.push([i, j]);

            selecting = 0;
            seletc1 = null;
            seletc2 = null;
        }



    
    zeichnen();


    canvas.addEventListener("mousedown", function(event) {

        const x = event.clientX;
        const y = event.clientY;


        for (const punkt of punkte) {

            
            const abstand = Math.hypot(
                punkt.x - x,
                punkt.y - y
            );


            
            if (abstand < 30) {

                if (selecting > 0) {

                    if (selecting === 1) {
                        seletc1 = punkt;
                        selecting = 2;
                    }
                    else if (selecting === 2 && seletc1 !== punkt) {
                        seletc2 = punkt;
                        selecting = 3;
                    }

                }
                gezogenerPunkt = punkt;
                break;
            }
        }
    });


    canvas.addEventListener("mousemove", function(event) {

        // Wenn kein Punkt gezogen wird
        if (gezogenerPunkt === null) {
            return;
        }


       gezogenerPunkt.x = Math.max(
            Math.min(event.clientX, max_x),
            min_x
        );

        gezogenerPunkt.y = Math.max(
            Math.min(event.clientY, max_y),
            min_y
        );


        // Alles neu zeichnen
        zeichnen();
    });


    

    canvas.addEventListener("mouseup", function() {

        gezogenerPunkt = null;
    });

    document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowLeft") {
         window.location.href = "main.html";
    }

    if (event.key === " ") {
         window.location.href = "induktio.html";
    }

    if (event.key === "Backspace") {
         deletion();
    }

    if (event.key === "Shift") {
         addition();
    }

    if (event.key === "Enter") {
         if(selecting==0){
            selecting=1;
         }
         else{
            selecting=0;
            seletc1=null;
            seletc2=null;
         }
    }
    if (event.key === "Alt") {
         window.location.href = "graph.html";
    }

   

    if (event.key === "o") {
         punkte.splice(0);
         erschienenepunkte=0;

    }

    });



</script>

</body>
</html>
