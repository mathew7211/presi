<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Punkte und Kanten</title>

    <style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
}

.container {
    display: flex;
    flex-direction: row;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
}

canvas {
    display: block;
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    background: white;
    touch-action: none;
}

#textBereich {
    flex: 0 0 auto;
    width: min(900px, 50vw);
    height: 100%;

    box-sizing: border-box;

    background: white;
    border-left: 1px solid black;

    display: flex;
    flex-direction: column;
}

#pdfBar {
    flex: 0 0 auto;
    padding: 6px 10px;
    font: 13px/1.4 -apple-system, system-ui, sans-serif;
    background: #f5f5f5;
    border-bottom: 1px solid #ddd;
    text-align: right;
}

#pdfBar a {
    color: #0645ad;
    text-decoration: none;
}

#textBereich iframe {
    flex: 1 1 auto;
    width: 100%;
    border: none;
}

/* On-screen controls: hidden on desktop, shown on touch/narrow screens
   because keyboard shortcuts (Enter, Shift, Backspace, Alt, 1-8, ...)
   are not usable without a physical keyboard. */
#mobileControls {
    display: none;
}

@media (max-width: 860px), (pointer: coarse) {

    .container {
        flex-direction: column;
    }

    canvas {
        flex: 0 0 55%;
        width: 100%;
        height: auto;
    }

    #textBereich {
        flex: 1 1 auto;
        width: 100%;
        height: auto;
        border-left: none;
        border-top: 1px solid black;
    }

    #mobileControls {
        display: flex;
        flex: 0 0 auto;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 6px 8px;
        background: #f0f0f0;
        border-top: 1px solid #ccc;
    }

    #mobileControls button,
    #mobileControls a {
        font: 13px/1 -apple-system, system-ui, sans-serif;
        padding: 9px 10px;
        border: 1px solid #999;
        border-radius: 6px;
        background: white;
        color: #111;
        text-decoration: none;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    #mobileControls button.active {
        background: #d33;
        color: white;
        border-color: #d33;
    }

    #mobileControls .levels {
        display: flex;
        gap: 4px;
    }

    #mobileControls .levels button {
        padding: 9px 8px;
        min-width: 32px;
        text-align: center;
    }

    #mobileControls .spacer {
        flex: 1 1 auto;
    }
}
    </style>
</head>

<body>

<div class="container">

    <canvas id="canvas"></canvas>

    <div id="mobileControls">
        <button type="button" id="btnAuswahl" onclick="auswahlUmschalten()">Punkte wählen</button>
        <button type="button" onclick="addition()">Kante +</button>
        <button type="button" onclick="deletion()">Kante –</button>
        <button type="button" onclick="punkteZuruecksetzen()">Zurücksetzen</button>

        <div class="levels">
            <button type="button" onclick="ebenenSetzen(1)">1</button>
            <button type="button" onclick="ebenenSetzen(2)">2</button>
            <button type="button" onclick="ebenenSetzen(3)">3</button>
            <button type="button" onclick="ebenenSetzen(4)">4</button>
            <button type="button" onclick="ebenenSetzen(5)">5</button>
            <button type="button" onclick="ebenenSetzen(6)">6</button>
            <button type="button" onclick="ebenenSetzen(7)">7</button>
            <button type="button" onclick="ebenenSetzen(8)">8</button>
        </div>

        <div class="spacer"></div>

        <a href="baume.html">Bäume</a>
        <a href="main.html">← Start</a>
    </div>

    <div id="textBereich">
        <div id="pdfBar">
            <a href="Baum.pdf" target="_blank" rel="noopener">PDF in neuem Tab öffnen ↗</a>
        </div>
        <iframe
            src="Baum.pdf#toolbar=0&navpanes=0&scrollbar=0&zoom=150"
            width="100%">
        </iframe>
    </div>

</div>

<script>


    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const rand = 20;

    let min_x, max_x, min_y, max_y;

    function grenzenAktualisieren() {
        min_x = rand;
        max_x = canvas.width - rand;

        min_y = rand;
        max_y = canvas.height - rand;
    }

    function canvasGroesseAktualisieren() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        grenzenAktualisieren();
    }

    // Erste Größenbestimmung (ersetzt die früher fest eingetragenen
    // window.innerWidth/innerHeight-Werte, die auf kleinen Bildschirmen
    // nicht funktioniert haben, da sie den PDF-Bereich nicht berücksichtigten)
    canvasGroesseAktualisieren();


      let gezogenerPunkt = null;


        const anzahlpunkte= 255;
        let erschienenepunkte=0;
        

        let letzteAddition = performance.now();

        const wartezeit = 100; 

        let punkte =[];

        let kanten= [

        ];


        const ebenen = 8;
const anzahlBaumPunkte = 2 ** ebenen - 1;
let zuerscheiendepunkte= 2 ** 3 - 1;

for (let i = 0; i < anzahlBaumPunkte; i++) {

    const links = 2 * i + 1;
    const rechts = 2 * i + 2;

    if (links < anzahlBaumPunkte) {
        kanten.push([i, links]);
    }

    if (rechts < anzahlBaumPunkte) {
        kanten.push([i, rechts]);
    }
}
 


       

        

        const kompliment = [];

        for (let i = 0; i < anzahlpunkte; i++) {
            for (let j = i+1; j <= anzahlpunkte; j++) {
            
                kompliment.push([i, j]);
            
            
        }
            
        }


    
    function zeichnen() {

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const drag1 = 0.000001;
        const jetzt = performance.now();

        if (
            erschienenepunkte < zuerscheiendepunkte &&
            jetzt - letzteAddition >= wartezeit
        ) {
            // Punkte erscheinen jetzt innerhalb des sichtbaren Bereichs,
            // egal wie groß oder klein der Bildschirm ist
            const a = min_x + Math.random() * (max_x - min_x);
            const b = min_y + Math.random() * (max_y - min_y);

            punkte.push({
                x: a,
                y: b
            });

            erschienenepunkte++;

            letzteAddition = jetzt;
        }

        if (
            erschienenepunkte > zuerscheiendepunkte){
                punkte.splice(zuerscheiendepunkte)
                erschienenepunkte= zuerscheiendepunkte;
            }




    
        for (const komplet of kompliment) {

            if(erschienenepunkte>komplet[1]){
                const k1=punkte[komplet[0]];
            const k2=punkte[komplet[1]];

            const dist_x = k1.x-k2.x;
            const dist_y = k1.y-k2.y;

            const dist = Math.hypot(dist_x,dist_y);

            const kraft = 1/(dist*dist);
            
            
            
            if(gezogenerPunkt!=k1&&dist<300){
                k1.x = Math.max(
                    Math.min(k1.x + dist_x * kraft, max_x),
                    min_x
                );

                k1.y = Math.max(
                    Math.min(k1.y + dist_y * kraft, max_y),
                    min_y
                );
            }
            
            if(gezogenerPunkt!=k2&&dist<200){
            k2.x = Math.max(
                    Math.min(k2.x - dist_x * kraft, max_x),
                    min_x
                );

                k2.y = Math.max(
                    Math.min(k2.y - dist_y * kraft, max_y),
                    min_y
                );
            }


            }


        }

        for (const kante of kanten) {
            if(erschienenepunkte>kante[1]){
            const punkt1 = punkte[kante[0]];
            const punkt2 = punkte[kante[1]];

            let displacment_x = punkte[kante[0]].x-punkte[kante[1]].x
            let displacment_y = punkte[kante[0]].y-punkte[kante[1]].y

            let displacment= 30-Math.sqrt(Math.pow(displacment_x,2)+Math.pow(displacment_y,2))

            displacment= Math.sign(displacment)*displacment*displacment;

            if(gezogenerPunkt!=punkt1){
            punkt1.x+=displacment_x*(displacment)*drag1;
            punkt1.y+=displacment_y*(displacment)*drag1;
            }

            if(gezogenerPunkt!=punkt2){
            punkt2.x-=displacment_x*(displacment)*drag1;
            punkt2.y-=displacment_y*(displacment)*drag1;
            }

        

            ctx.beginPath();

            ctx.moveTo(punkt1.x, punkt1.y);
            ctx.lineTo(punkt2.x, punkt2.y);

            ctx.strokeStyle = "black";
            ctx.stroke();
        }
    }


      
        for (const punkt of punkte) {

            ctx.beginPath();

            ctx.arc(
                punkt.x,
                punkt.y,
                5,
                0,
                Math.PI * 2
            );
            if(punkt==seletc1||punkt==seletc2){
                ctx.fillStyle = "red";
            }else{
              ctx.fillStyle = "black";  
            }
            
            ctx.fill();
        }



        requestAnimationFrame(zeichnen);
    }

    let seletc1=null;
    let seletc2=null;
    let selecting = 0; // 0 no pints jet 1 2 


    function deletion(){
        if (selecting !== 3) {
            return;
        }

        let i_ = punkte.indexOf(seletc1);
        let j_ = punkte.indexOf(seletc2);

        let i = Math.min(i_, j_);
        let j = Math.max(i_, j_);

        const index = kanten.findIndex(
            k => k[0] === i && k[1] === j
        );

        if (index !== -1) {
            kanten.splice(index, 1);
        }

        selecting = 0;
        seletc1=null;
            seletc2=null;

        aktualisiereAuswahlButton();

    }

        function addition() {
            if (selecting !== 3) {
                return;
            }

            let i_ = punkte.indexOf(seletc1);
            let j_ = punkte.indexOf(seletc2);

            let i = Math.min(i_, j_);
            let j = Math.max(i_, j_);

            kanten.push([i, j]);

            selecting = 0;
            seletc1 = null;
            seletc2 = null;

            aktualisiereAuswahlButton();
        }


    // ---- Hilfsfunktionen, die von Tastatur UND den Bedienknöpfen
    //      (für Touch-Geräte) gemeinsam genutzt werden ----

    function auswahlUmschalten() {
        if (selecting == 0) {
            selecting = 1;
        } else {
            selecting = 0;
            seletc1 = null;
            seletc2 = null;
        }
        aktualisiereAuswahlButton();
    }

    function punkteZuruecksetzen() {
        punkte.splice(0);
        erschienenepunkte = 0;
    }

    function ebenenSetzen(zahl) {
        zuerscheiendepunkte = 2 ** zahl - 1;
    }

    function aktualisiereAuswahlButton() {
        const btn = document.getElementById("btnAuswahl");
        if (!btn) return;

        if (selecting > 0) {
            btn.classList.add("active");
            btn.textContent = "Auswahl abbrechen";
        } else {
            btn.classList.remove("active");
            btn.textContent = "Punkte wählen";
        }
    }

    aktualisiereAuswahlButton();

    
    zeichnen();


    // ---- Position eines Maus-/Touch-Ereignisses in Canvas-Koordinaten
    //      umrechnen (nötig, da der Canvas nicht mehr zwingend bei
    //      0,0 im Fenster beginnt, z.B. im gestapelten Mobil-Layout) ----
    function canvasPosition(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const skalaX = canvas.width / rect.width;
        const skalaY = canvas.height / rect.height;

        return {
            x: (clientX - rect.left) * skalaX,
            y: (clientY - rect.top) * skalaY
        };
    }

    function zeigerStart(clientX, clientY) {
        const pos = canvasPosition(clientX, clientY);

        for (const punkt of punkte) {

            const abstand = Math.hypot(
                punkt.x - pos.x,
                punkt.y - pos.y
            );

            if (abstand < 30) {

                if (selecting > 0) {

                    if (selecting === 1) {
                        seletc1 = punkt;
                        selecting = 2;
                    }
                    else if (selecting === 2 && seletc1 !== punkt) {
                        seletc2 = punkt;
                        selecting = 3;
                    }

                }
                gezogenerPunkt = punkt;
                break;
            }
        }
    }

    function zeigerBewegung(clientX, clientY) {
        if (gezogenerPunkt === null) {
            return;
        }

        const pos = canvasPosition(clientX, clientY);

        gezogenerPunkt.x = Math.max(
            Math.min(pos.x, max_x),
            min_x
        );

        gezogenerPunkt.y = Math.max(
            Math.min(pos.y, max_y),
            min_y
        );

        zeichnen();
    }

    function zeigerEnde() {
        gezogenerPunkt = null;
    }


    // ---- Maus (Desktop) ----

    canvas.addEventListener("mousedown", function(event) {
        zeigerStart(event.clientX, event.clientY);
    });

    canvas.addEventListener("mousemove", function(event) {
        zeigerBewegung(event.clientX, event.clientY);
    });

    canvas.addEventListener("mouseup", function() {
        zeigerEnde();
    });


    // ---- Touch (Handy/Tablet) ----

    canvas.addEventListener("touchstart", function(event) {
        if (event.touches.length === 0) return;
        event.preventDefault();
        const touch = event.touches[0];
        zeigerStart(touch.clientX, touch.clientY);
    }, { passive: false });

    canvas.addEventListener("touchmove", function(event) {
        if (event.touches.length === 0) return;
        event.preventDefault();
        const touch = event.touches[0];
        zeigerBewegung(touch.clientX, touch.clientY);
    }, { passive: false });

    canvas.addEventListener("touchend", function(event) {
        event.preventDefault();
        zeigerEnde();
    }, { passive: false });

    canvas.addEventListener("touchcancel", function() {
        zeigerEnde();
    });


    // ---- Fenstergröße ändert sich (Rotation, Resize, ...) ----

    function beiGroessenaenderung() {
        canvasGroesseAktualisieren();

        // Vorhandene Punkte in den neuen sichtbaren Bereich zwingen,
        // damit nach einer Drehung nichts außerhalb des Bildschirms hängt
        for (const p of punkte) {
            p.x = Math.max(Math.min(p.x, max_x), min_x);
            p.y = Math.max(Math.min(p.y, max_y), min_y);
        }
    }

    window.addEventListener("resize", beiGroessenaenderung);
    window.addEventListener("orientationchange", function() {
        setTimeout(beiGroessenaenderung, 150);
    });


    document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowLeft") {
         window.location.href = "main.html";
    }

    if (event.key === " ") {
         window.location.href = "main.html";
    }

    if (event.key === "Backspace") {
         deletion();
    }

    if (event.key === "Shift") {
         addition();
    }

    if (event.key === "Enter") {
         auswahlUmschalten();
    }
    if (event.key === "Alt") {
         window.location.href = "baume.html";
    }

   

    if (event.key === "o") {
         punkteZuruecksetzen();
    }

    if (event.key >= "1" && event.key <= "8") {
        const zahl = Number(event.key);

        ebenenSetzen(zahl);


    
    }

    });



</script>

</body>
</html>
