<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Punkte und Kanten</title>

    <style>
        .container {
    position: relative;
    width: 100vw;
    height: 100vh;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}
#svgOverlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    pointer-events: none;
}

 #textBereich {
        position: absolute;
        top: 0;
        right: 0;

        width: 900px;
        height: 100%;

        box-sizing: border-box;
        padding: 20px;

        background: rgba(255, 255, 255, 0);
        border-left: 1px solid black;

        z-index: 10;
    }

    #text {
        width: 100%;
        height: 100%;

        box-sizing: border-box;

        resize: none;
        border: none;
        outline: none;

        font-size: 18px;
        font-family: Arial, sans-serif;
    }
    </style>
</head>

<body>

<div class="container">



    <canvas id="canvas"></canvas>
    


    <div id="textBereich">
       <iframe 
    src="formulas.pdf#toolbar=0&navpanes=0&scrollbar=0&zoom=150"
    width="100%"
    height="100%"
    style="border: none;">
</iframe>
    </div>
    
</div>

<script>

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const sidebarBreite = 900;
    const mitteX = (canvas.width - sidebarBreite) / 2;
    const mitteY = canvas.height / 2;

    // Gitterauflösung des Quadrats (u,v in [0,1])
    const n = 14;

    // --- die drei Formen als Funktionen von (u,v) ---

    function quadrat(u, v) {
        const s = 220;
        return { x: (u - 0.5) * s, y: (v - 0.5) * s, z: 0 };
    }

    function zylinder(u, v) {
        // Kante b (links/rechts) wird verklebt: u läuft einmal im Kreis
        const r = 90;
        const s = 220;
        const w = u * Math.PI * 2;
        return { x: r * Math.cos(w), y: (v - 0.5) * s, z: r * Math.sin(w) };
    }

    function torus(u, v) {
        // Kante a (oben/unten) wird zusätzlich verklebt: v läuft einmal im Kreis
        const R = 150;
        const r = 65;
        const a = u * Math.PI * 2;
        const b = v * Math.PI * 2;
        return {
            x: (R + r * Math.cos(a)) * Math.cos(b),
            z: (R + r * Math.cos(a)) * Math.sin(b),
            y: r * Math.sin(a)
        };
    }

    function mix(p, q, k) {
        return {
            x: p.x + (q.x - p.x) * k*k*k*k,
            y: p.y + (q.y - p.y) * k*k*k*k,
            z: p.z + (q.z - p.z) * k*k*k*k
        };
    }

    // t=0 -> flaches Quadrat, t=1 -> Zylinder, t=2 -> Torus
    function punktAn(u, v, t) {
        if (t <= 1) return mix(quadrat(u, v), zylinder(u, v), t);
        return mix(zylinder(u, v), torus(u, v), t - 1);
    }

    function projizieren(p) {
        const cosD = Math.cos(drehung), sinD = Math.sin(drehung);
        const x = p.x * cosD + p.z * sinD;
        const z = -p.x * sinD + p.z * cosD;
        const persp = 320 / (320 + z);
        return { sx: mitteX + x * persp, sy: mitteY + p.y * persp };
    }

    let t = -0.5;      // Fortschritt der Verwandlung, mit Pausen an den Enden
    let drehung = 0;

    function zeichnen() {

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        t += 0.0045;
        if (t > 2.5) t = drehung += 0.006;;
        

        const tk = Math.max(0, Math.min(2, t));

        // Gitterpunkte berechnen und projizieren
        const punkte = [];
        for (let i = 0; i <= n; i++) {
            const zeile = [];
            for (let j = 0; j <= n; j++) {
                const p3 = punktAn(i / n, j / n, tk);
                zeile.push(projizieren(p3));
            }
            punkte.push(zeile);
        }

        // inneres Gitter, dünn
        ctx.strokeStyle = "black";
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= n; i++) {
            ctx.beginPath();
            for (let j = 0; j <= n; j++) {
                const p = punkte[i][j];
                if (j === 0) ctx.moveTo(p.sx, p.sy); else ctx.lineTo(p.sx, p.sy);
            }
            ctx.stroke();
        }
        for (let j = 0; j <= n; j++) {
            ctx.beginPath();
            for (let i = 0; i <= n; i++) {
                const p = punkte[i][j];
                if (i === 0) ctx.moveTo(p.sx, p.sy); else ctx.lineTo(p.sx, p.sy);
            }
            ctx.stroke();
        }

        // Randkanten hervorgehoben: a = oben/unten (rot), b = links/rechts (blau)
        function randlinie(feststehend, wert, farbe) {
            ctx.beginPath();
            for (let k = 0; k <= n; k++) {
                const p = feststehend === "j" ? punkte[k][wert] : punkte[wert][k];
                if (k === 0) ctx.moveTo(p.sx, p.sy); else ctx.lineTo(p.sx, p.sy);
            }
            ctx.strokeStyle = farbe;
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        randlinie("j", 0, "crimson");     // Kante a
        randlinie("j", n, "crimson");     // Kante a⁻¹
        randlinie("i", 0, "royalblue");   // Kante b
        randlinie("i", n, "royalblue");   // Kante b⁻¹

        // Beschriftung der Kanten
    
        // Statuszeile
        ctx.fillStyle = "black";
        ctx.font = "14px Arial";
        let name = "Quadrat";
        if (tk > 0 && tk < 1) name = "Quadrat → Zylinder (Kante b wird verklebt)";
        else if (tk === 1) name = "Zylinder";
        else if (tk > 1 && tk < 2) name = "Zylinder → Torus (Kante a wird verklebt)";
        else if (tk === 2) name = "Torus";
        ctx.fillText("CW-Komplex a b a⁻¹ b⁻¹  —  " + name, 20, canvas.height - 20);

        requestAnimationFrame(zeichnen);
    }

    zeichnen();

    document.addEventListener("keydown", function (event) {

        if (event.key === "ArrowLeft") {
            window.location.href = "main.html";
        }

        if (event.key === " ") {
            window.location.href = "baume.html";
        }

        if (event.key === "Alt") {
            window.location.href = "erste_induktionsanwendung.html";
        }

    });

</script>

</body>
</html>
